# Project-scoped Codex configuration for code-agent-harness.
# Codex loads project config only when the project is trusted.
# Keep personal model, profile, reasoning, verbosity, and web search preferences
# in ~/.codex/config.toml, not here.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 65536

[sandbox_workspace_write]
network_access = false

[features]
codex_hooks = true

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800
